 font-weight="bold">Power: separate USB power supply at the CAJOE USB socket</text><path d="M 451 335 C 560 358, 700 355, 838 355" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/><text x="640" y="341" font-size="11" fill="#111111" font-weight="bold" text-anchor="middle">black — GND (common ground mandatory)</text><path d="M 914 362 L 914 544 C 914 555, 907 560, 894 560 L 612 560" fill="none" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/><path d="M 612 560 l -6 -8 l -8 16 l -8 -16 l -8 16 l -8 -16 l -8 16 l -6 -8" fill="none" stroke="#b8860b" stroke-width="3"/><path d="M 560 560 C 505 560, 452 554, 452 492 L 452 402 C 452 397, 450 394, 447 392" fill="none" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/><text x="586" y="542" font-size="12" fill="#b8860b" font-weight="bold" text-anchor="middle">10 kΩ</text><text x="758" y="580" font-size="11" fill="#5a6678" text-anchor="middle">white — signal (P3 VIN tap)</text><text x="30" y="620" font-size="13" fill="#1a2433" font-weight="bold">Mapping:</text><text x="30" y="642" font-size="13" fill="#1a2433">Power: USB supply at the CAJOE   ·   GND (black) → pin 9   ·   signal (white) → 10 kΩ in series → pin 11 (GPIO17, bias-free)</text><text x="30" y="666" font-size="13" fill="#1a2433">The crucial part is the software setting: GPIO 17 bias-free (pull none) — install_seedgen.py makes this permanent.</text><text x="30" y="692" font-size="13" fill="#c0392b" font-weight="bold">⚠ HIGH VOLTAGE on parts of the board (~400 V) — never touch the device while powered!</text></svg>